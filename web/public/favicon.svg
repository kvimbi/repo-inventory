<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="repo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="node-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="box-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer isometric inventory container card -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#box-bg)" stroke="url(#repo-grad)" stroke-width="2.5" />
  
  <!-- Subtle inner ambient shelf lines -->
  <path d="M14 44 H50" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3" />
  <path d="M14 50 H50" stroke="#1e293b" stroke-width="1.5" />

  <!-- Git Branch Network inside Inventory Box -->
  <!-- Main Trunk -->
  <path d="M24 18 V42" stroke="url(#repo-grad)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Branching Path -->
  <path d="M24 34 C 24 26, 42 32, 42 22" fill="none" stroke="url(#repo-grad)" stroke-width="3" stroke-linecap="round" />

  <!-- Git Commit Nodes -->
  <!-- Base Trunk Node -->
  <circle cx="24" cy="42" r="4" fill="#0f172a" stroke="url(#repo-grad)" stroke-width="3" />
  
  <!-- Main Root Node (Glowing) -->
  <circle cx="24" cy="18" r="4.5" fill="url(#repo-grad)" filter="url(#glow)" />
  
  <!-- Branch Tip Node (Healthy Emerald Accent) -->
  <circle cx="42" cy="22" r="4" fill="url(#node-accent)" stroke="#0f172a" stroke-width="1.5" />

  <!-- Scanning indicator beam dot -->
  <circle cx="24" cy="30" r="2" fill="#38bdf8" />
</svg>
